# Anthropic Claude Haiku (native API)
#
# Fast, cost-effective model. Good for simpler queries.
# Install: pip install anthropic
# Set your API key: export ANTHROPIC_API_KEY="sk-ant-..."

name: "Claude Haiku"
provider: anthropic
model: claude-haiku-4-5-20251001
api_base: null           # Uses default: https://api.anthropic.com
api_key_env: ANTHROPIC_API_KEY
temperature: 0.0
max_tokens: 4096
context_window: 200000   # Claude Haiku context window
