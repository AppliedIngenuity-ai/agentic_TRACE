# LFM2-1.2B-Tool via llama.cpp (text-based tool calling)
#
# For models that don't support native API tool calling but are trained
# with special tokens for function calling (LFM2, etc.).
#
# Tool definitions are injected into the system prompt using special tokens,
# and tool calls are parsed from the response text.
#
# Start llama.cpp server:
#   llama-server -m LFM2-1.2B-Tool-Q8_0.gguf --port 8080
#
# The provider uses the OpenAI-compatible HTTP endpoint but bypasses
# the server's tool calling, handling it in the prompt instead.

name: "LFM2 Tool"
provider: text-tool-calling
model: LFM2-1.2B-Tool
api_base: http://localhost:8080/v1
api_key_env: null
temperature: 0.0
max_tokens: 4096
context_window: 8192      # LFM2-1.2B context window

# Optional: restrict to essential tools (reduces prompt size for small models)
# tools:
#   - resolve_time
#   - explore
#   - create_view
#   - compute_indicator
#   - aggregate
#   - chart

# Special tokens for tool calling (these are the LFM2 defaults)
extra:
  tool_call_start: "<|tool_call_start|>"
  tool_call_end: "<|tool_call_end|>"
  tool_list_start: "<|tool_list_start|>"
  tool_list_end: "<|tool_list_end|>"
  tool_response_start: "<|tool_response_start|>"
  tool_response_end: "<|tool_response_end|>"
